nginx/conf.d/default.conf


# *** DEFAULT ***

server {
    listen 80;
    server_name asi-232v.cifpaviles.com www.asi-232v.cifpaviles.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name asi-232v.cifpaviles.com www.asi-232v.cifpaviles.com;

    ssl_certificate /etc/nginx/certs/asi-232v.cifpaviles.com-cert.crt;
    ssl_certificate_key /etc/nginx/certs/asi-232v.cifpaviles.com-private-key.pem;

    location / {
        proxy_pass http://default-front;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

